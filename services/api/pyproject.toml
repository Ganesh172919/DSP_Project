[project]
name = "deepshield-guardian-api"
version = "0.1.0"
description = "FastAPI backend for deepfake-resistant face authentication."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiosqlite>=0.20.0",
  "asyncpg>=0.29.0",
  "cryptography>=44.0.2",
  "email-validator>=2.2.0",
  "fastapi>=0.115.12",
  "httpx>=0.28.1",
  "numpy>=2.2.4",
  "passlib[bcrypt]>=1.7.4",
  "pillow>=11.1.0",
  "pydantic-settings>=2.8.1",
  "python-jose[cryptography]>=3.4.0",
  "redis>=5.2.1",
  "sqlalchemy>=2.0.39",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.25.3"
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
